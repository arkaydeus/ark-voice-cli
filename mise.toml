[tools]
bun = "1.4.4"

# Documentation site (site/). Run from anywhere in the repository, e.g. `mise run site:dev`.

[tasks."site:install"]
description = "Install site dependencies"
dir = "{{config_root}}/site"
run = "bun install"

[tasks."site:dev"]
description = "Start the docs site dev server"
dir = "{{config_root}}/site"
run = "bun --bun next dev"

[tasks."site:build"]
description = "Build the docs site for production"
dir = "{{config_root}}/site"
run = "bun --bun next build"

[tasks."site:start"]
description = "Serve the production build"
dir = "{{config_root}}/site"
run = "bun --bun next start"

[tasks."site:fmt"]
description = "Format the site with bun fmt"
dir = "{{config_root}}/site"
run = "bun fmt"

[tasks."site:check"]
description = "Check formatting and types"
dir = "{{config_root}}/site"
run = [
  "bun fmt --check",
  # Route types (PageProps, LayoutProps) are generated by Next.js.
  "bun --bun next typegen",
  "bun check",
]
