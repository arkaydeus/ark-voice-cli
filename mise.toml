[tools]
bun = "1.4.4"

# Documentation site (web/). Run from anywhere in the repository, e.g. `mise run web:dev`.

[tasks."web:install"]
description = "Install web dependencies"
dir = "{{config_root}}/web"
run = "bun install"

[tasks."web:dev"]
description = "Start the docs site dev server"
dir = "{{config_root}}/web"
run = "bun --bun next dev"

[tasks."web:build"]
description = "Build the docs site for production"
dir = "{{config_root}}/web"
run = "bun --bun next build"

[tasks."web:start"]
description = "Serve the production build"
dir = "{{config_root}}/web"
run = "bun --bun next start"

[tasks."web:fmt"]
description = "Format the web project with bun fmt"
dir = "{{config_root}}/web"
run = "bun fmt"

[tasks."web:test"]
description = "Test docs loaders and interactive components"
dir = "{{config_root}}/web"
run = "bun run test"

[tasks."web:check"]
description = "Check formatting and types"
dir = "{{config_root}}/web"
run = [
  "bun fmt --check",
  # Route types (PageProps, LayoutProps) are generated by Next.js.
  "bun --bun next typegen",
  "bun check",
]
